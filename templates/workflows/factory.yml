# Taśma fabryki w repo projektu. Skopiuj do .github/workflows/factory.yml.
# Wymaga sekretu CLAUDE_CODE_OAUTH_TOKEN (Settings → Secrets and variables → Actions).
#
# Przebieg: etykieta `ready` na issue → plan → implementacja (PR z gałęzi factory/*) → recenzja → ocena ryzyka
# → werdykt mergera. Kolejne etapy uruchamiają się przez workflow_dispatch. Czerwone CI albo prośba recenzenta
# o zmiany odsyła PR do implementera (do risk.max_review_rounds rund); werdykt powstaje po tej pętli.
# Komendy w komentarzach: /approve, /veto, /reject, /change, /split.
# W Etapie 0 (tryb cienia) fabryka niczego nie scala: o każdym PR decydujesz Ty, a werdykt fabryki oceniasz 👍 albo 👎.
# Dziennik z metrykami prowadzi przypięte issue „Tryb cienia”.
# Kolejka: zadanie ponad wip_limit albo ze wspólnymi plikami z zadaniem w toku czeka z etykietą `queued`
# i rusza samo po zamknięciu PR fabryki (albo przy dziennym przeglądzie).
name: factory

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]   # dziennik i kolejka; kodu z PR nie pobierają
  schedule:
    - cron: '17 4 * * *'   # dziennik i kolejka raz dziennie, bo reakcje 👍/👎 nie uruchamiają workflowów
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        options: [plan, implement, review, journal, queue]
        required: true
      issue: { type: string, default: '' }
      pr: { type: string, default: '' }
      note: { type: string, default: '' }

permissions: {}

concurrency:
  group: factory-${{ github.event.issue.number || inputs.pr || inputs.issue }}-${{ inputs.stage || github.event_name }}
  cancel-in-progress: false

jobs:
  plan:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'ready') ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'plan')
    uses: gibkigonzo/factory/.github/workflows/plan.yml@main
    with:
      issue: ${{ github.event.issue.number || inputs.issue }}
      note: ${{ inputs.note }}
      factory_ref: main
      runs_on: ubuntu-latest   # albo np. '["self-hosted", "vps"]'
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write

  implement:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'implement'
    uses: gibkigonzo/factory/.github/workflows/implement.yml@main
    with:
      issue: ${{ inputs.issue }}
      pr: ${{ inputs.pr }}
      note: ${{ inputs.note }}
      factory_ref: main
      runs_on: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write

  review:
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'review'
    uses: gibkigonzo/factory/.github/workflows/review.yml@main
    with:
      pr: ${{ inputs.pr }}
      factory_ref: main
      runs_on: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:     # zapis tylko dla joba pętli poprawek (bez Claude): komentarz z uwagami i kolejna runda
      contents: read
      issues: write
      pull-requests: write
      actions: write

  risk:
    needs: review
    if: needs.review.outputs.ok == 'true'
    uses: gibkigonzo/factory/.github/workflows/risk.yml@main
    with:
      pr: ${{ inputs.pr }}
      factory_ref: main
      runs_on: ubuntu-latest
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    permissions:
      contents: read
      checks: write
      issues: write
      pull-requests: write

  merge:
    needs: risk
    uses: gibkigonzo/factory/.github/workflows/merge.yml@main
    with:
      pr: ${{ inputs.pr }}
    permissions:
      pull-requests: write

  journal:
    needs: merge
    if: >-
      !cancelled() && (
        needs.merge.result == 'success' ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.stage == 'journal') ||
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          startsWith(github.event.pull_request.head.ref, 'factory/')))
    uses: gibkigonzo/factory/.github/workflows/journal.yml@main
    with:
      factory_ref: main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  queue:
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'queue') ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'factory/'))
    uses: gibkigonzo/factory/.github/workflows/queue.yml@main
    with:
      factory_ref: main
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: write

  commands:
    if: github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/')
    uses: gibkigonzo/factory/.github/workflows/commands.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
