# Etap recenzji PR z gałęzi factory/*: komendy z factory.yml (CI), skład panelu i recenzenci równolegle.
# Recenzenci mają tylko narzędzia do odczytu i repo bez poświadczeń. Werdykty trafiają do artefaktów,
# a ocenę ryzyka liczy risk.yml w tym samym uruchomieniu.
# Pętla poprawek: czerwone CI albo request_changes odsyła PR do implementera z uwagami (job loop, bez Claude),
# do risk.max_review_rounds rund. Wtedy wyjście ok jest false, więc ocena ryzyka i werdykt czekają na wynik pętli.
# Przy czerwonym CI recenzenci nie ruszają, chyba że to ostatnia runda.
# Zrzuty ekranu: komenda evidence.screenshots z factory.yml zapisuje PNG po CI, także na punkcie rozgałęzienia.
# Recenzent wyglądu dostaje tylko sekcje zmienione przez PR (porównanie pikseli), a gdy nic się nie zmieniło,
# werdykt wystawia skrypt bez modelu. Job gallery daje w PR linki do par wzorzec–wykonanie (gałąź factory-screenshots).
name: factory-review

on:
  workflow_call:
    inputs:
      pr: { type: string, required: true }
      factory_ref: { type: string, default: main }
      runs_on: { type: string, default: ubuntu-latest }
      node_version: { type: string, default: '22' }
      trusted: { type: string, default: '' }
      max_parallel: { type: string, default: '3', description: 'Ilu recenzentów naraz' }
      workflow: { type: string, default: factory.yml, description: 'Plik workflowu projektu, który wywołuje fabrykę' }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }
    outputs:
      ok:
        description: 'true, gdy recenzja się skończyła i można liczyć ryzyko; false także wtedy, gdy PR wrócił do poprawek'
        value: ${{ (jobs.guard.outputs.ok == 'true' && jobs.loop.outputs.retry != 'true' && jobs.limit.outputs.limited != 'true') && 'true' || 'false' }}

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.trust.outputs.ok }}
    steps:
      - id: trust
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA: ${{ inputs.trusted }}
        run: |
          if [[ ",$OWNER,github-actions[bot],$EXTRA," == *",$ACTOR,"* ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Konto $ACTOR nie jest na liście zaufanych; taśma pomija to zdarzenie."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on, '[') && inputs.runs_on || format('"{0}"', inputs.runs_on)) }}
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.round.outputs.status }}
      round: ${{ steps.round.outputs.round }}
      auto: ${{ steps.round.outputs.auto }}
      final: ${{ steps.round.outputs.final }}
      screenshots: ${{ steps.shots.outputs.configured }}
      sha: ${{ steps.shots.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          mkdir -p .factory/work && printf '.factory/work/\n' >> .git/info/exclude
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "W=.factory/work" >> "$GITHUB_ENV"
          corepack enable || true

      - name: factory.yml z bazy
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          mkdir -p "$RUNNER_TEMP/base"
          git archive "origin/$BASE" factory.yml .factory/perspectives 2>/dev/null | tar -x -C "$RUNNER_TEMP/base" \
            || git show "origin/$BASE:factory.yml" > "$RUNNER_TEMP/base/factory.yml"
          node "$F/scripts/config/cli.ts" "$RUNNER_TEMP/base/factory.yml" --json > "$W/config.json"
          echo "fork=$(git merge-base "origin/$BASE" HEAD)" >> "$GITHUB_OUTPUT"

      - name: Komendy z factory.yml
        run: node "$F/scripts/workflow/cli.ts" ci --config "$W/config.json" --out "$W/ci.json"

      - name: Runda poprawek
        id: round
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          LABELS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels)
          ROUND=$(jq '[.labels[].name | select(startswith("factory:round-")) | ltrimstr("factory:round-") | tonumber] | max // 0' <<<"$LABELS")
          # Rundy po /change właściciela (etykiety factory:change-N) nie liczą się do limitu automatycznych rund.
          CHANGES=$(jq '[.labels[].name | select(startswith("factory:change-"))] | length' <<<"$LABELS")
          AUTO=$((ROUND - CHANGES))
          if [ "$AUTO" -lt 0 ]; then AUTO=0; fi
          MAX=$(jq .risk.max_review_rounds "$W/config.json")
          {
            echo "status=$(jq -r .status "$W/ci.json")"
            echo "round=$ROUND"
            echo "auto=$AUTO"
            echo "final=$([ "$AUTO" -ge "$MAX" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-ci
          path: .factory/work/ci.json
          include-hidden-files: true

      - name: Zrzuty ekranu
        id: shots
        continue-on-error: true   # brak zrzutów nie zatrzymuje recenzji; recenzent i galeria mówią, czego brakuje
        run: |
          # Bez evidence.screenshots w factory.yml krok nic nie robi. Komenda zapisuje PNG w $FACTORY_SCREENSHOTS.
          RESULT=$(node "$F/scripts/workflow/cli.ts" screenshots --config "$W/config.json" --out "$RUNNER_TEMP/screenshots")
          echo "Zrzuty ekranu: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "configured=$(jq -r .configured <<<"$RESULT")"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.shots.outputs.configured == 'true'
        with:
          name: factory-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

      - name: Zrzuty ekranu gałęzi bazowej
        if: steps.shots.outputs.configured == 'true'
        continue-on-error: true   # bez nich recenzent wyglądu i galeria biorą wszystkie zrzuty
        env:
          FORK: ${{ steps.base.outputs.fork }}
        run: |
          # Ta sama komenda na punkcie rozgałęzienia, w osobnym katalogu roboczym z własnym setup. Porównanie pikseli
          # z wykonaniem wskazuje sekcje zmienione przez PR; tylko je ocenia recenzent wyglądu.
          git worktree add --detach "$RUNNER_TEMP/base-tree" "$FORK"
          cd "$RUNNER_TEMP/base-tree"
          node "$F/scripts/workflow/cli.ts" screenshots --setup --config "$GITHUB_WORKSPACE/$W/config.json" \
            --out "$RUNNER_TEMP/screenshots-base"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.shots.outputs.configured == 'true'
        with:
          name: factory-screenshots-base
          path: ${{ runner.temp }}/screenshots-base
          if-no-files-found: ignore

  panel:
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      matrix: ${{ steps.panel.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          mkdir -p .factory/work/artifacts && printf '.factory/work/\n' >> .git/info/exclude
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "W=.factory/work" >> "$GITHUB_ENV"

      - name: Skład panelu i dane dla recenzentów
        id: panel
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ inputs.pr }}
        run: |
          BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          mkdir -p "$RUNNER_TEMP/base"
          git archive "origin/$BASE" factory.yml .factory/perspectives 2>/dev/null | tar -x -C "$RUNNER_TEMP/base" \
            || git show "origin/$BASE:factory.yml" > "$RUNNER_TEMP/base/factory.yml"
          node "$F/scripts/config/cli.ts" "$RUNNER_TEMP/base/factory.yml" --json > "$W/config.json"
          # Punkt rozgałęzienia zapisany raz: ocena ryzyka liczy od niego ten sam diff, także gdy PR scalono w trakcie recenzji
          # (wtedy merge-base z gałęzią główną to sama głowa PR, a diff byłby pusty).
          git merge-base "origin/$BASE" HEAD > "$W/base.sha"
          node "$F/scripts/review/panel.ts" --base "$(cat "$W/base.sha")" --head HEAD --out "$W" > "$W/panel.json"
          # Lockfile'y i pliki generowane zamiast w diffie są w streszczeniu skipped.md (pakiety, wersje, hosty).
          node "$F/scripts/workflow/cli.ts" review-diff --base "$(cat "$W/base.sha")" --config "$W/config.json" \
            --out "$W/diff.patch" --summary "$W/skipped.md"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$W/pr.md"
          # Uwagi, na które odpowiadała ta runda: ostatni komentarz rundy od taśmy albo /change właściciela.
          # Dostaje je recenzent wyglądu, żeby nie żądał odwrotności tego, co implementer właśnie poprawił.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq '.[] | {login: .user.login, body: (.body // ""), created_at}' \
            | jq -rs --arg owner "$OWNER" '[.[] | select(
                (.login == "github-actions[bot]" and (.body | startswith("<!-- factory:round -->")))
                or (.login == $owner and (.body | split("\n")[0] | test("^\\s*/change([\\s:,.!]|$)"; "i"))))]
                | sort_by(.created_at) | last | .body // ""' > "$W/previous-round.md"
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json body \
            | node "$F/scripts/workflow/cli.ts" find-implementation --pr "$PR" > "$W/implementation.json"
          ISSUE=$(jq -r .issue "$W/implementation.json")
          gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$W/spec.md"
          echo "matrix=$(jq -c .run "$W/panel.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-review-input
          path: .factory/work
          include-hidden-files: true

  reviewer:
    # Recenzenci czekają na CI, żeby oprzeć uwagi na jego wyniku, a nie na domysłach.
    # Czerwone CI wraca do implementera bez recenzji; recenzenci oceniają je tylko w ostatniej rundzie.
    needs: [panel, ci]
    if: >-
      always() && needs.panel.result == 'success' &&
      needs.panel.outputs.matrix != '' && needs.panel.outputs.matrix != '[]' &&
      (needs.ci.outputs.status != 'failure' || needs.ci.outputs.final == 'true')
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        member: ${{ fromJSON(needs.panel.outputs.matrix) }}
    name: reviewer (${{ matrix.member.name }})
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on, '[') && inputs.runs_on || format('"{0}"', inputs.runs_on)) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          printf '.factory/work/\n' >> .git/info/exclude
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "W=.factory/work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-review-input
          path: .factory/work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-ci
          merge-multiple: true
          path: .factory/work
      # Zrzuty tylko dla perspektywy, która je ocenia (screenshots: true), i tylko gdy projekt ma evidence.screenshots.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.member.screenshots
        with:
          pattern: factory-screenshots
          merge-multiple: true
          path: .factory/work/screenshots
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.member.screenshots
        with:
          pattern: factory-screenshots-base
          merge-multiple: true
          path: .factory/work/screenshots-base

      - name: Wygląd bez zmian
        id: visual
        if: matrix.member.screenshots
        env:
          NAME: ${{ matrix.member.name }}
        run: |
          # Wszystkie zrzuty identyczne jak na gałęzi bazowej: nie ma czego oceniać, więc werdykt bez sesji Claude.
          if VERDICT=$(node "$F/scripts/workflow/cli.ts" screenshots-unchanged --work "$W" --name "$NAME"); then
            echo "::notice::Wygląd bez zmian względem gałęzi bazowej; perspektywa $NAME bez modelu."
            { echo "skip=true"; echo "verdict=$VERDICT"; } >> "$GITHUB_OUTPUT"
          fi

      - name: Prompt recenzenta
        id: data
        env:
          AGENT: ${{ matrix.member.agent }}
          CRITERIA: ${{ matrix.member.criteria }}
          SCREENSHOTS: ${{ matrix.member.screenshots }}
        run: |
          ARGS=(--work "$W" --agent "$AGENT")
          if [ -n "$CRITERIA" ]; then ARGS+=(--criteria "$CRITERIA"); fi
          if [ "$SCREENSHOTS" = true ] && grep -q '[^[:space:]]' "$W/previous-round.md" 2>/dev/null; then ARGS+=(--previous "$W/previous-round.md"); fi
          node "$F/scripts/workflow/cli.ts" prompt review "${ARGS[@]}" > "$W/prompt.md"
          {
            echo "schema=$(node "$F/scripts/workflow/cli.ts" schema verdict)"
            echo "tools=$(node "$F/scripts/workflow/cli.ts" tools read)"
            echo "denied=$(node "$F/scripts/workflow/cli.ts" denied-tools)"
            echo "prompt<<FACTORY_EOF"; cat "$W/prompt.md"; echo "FACTORY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bun dla akcji Claude
        id: bun
        continue-on-error: true
        run: |
          # Bun z rejestru npm zamiast z GitHub Releases, które bywają niedostępne (HTTP 504).
          # Wersja jak w przypiętym claude-code-action. Gdy się nie uda, akcja pobierze Buna sama.
          [ "$(uname -s)" = Linux ] || exit 0
          case "$(uname -m)" in x86_64) PKG=@oven/bun-linux-x64 ;; aarch64|arm64) PKG=@oven/bun-linux-aarch64 ;; *) exit 0 ;; esac
          npm install --prefix "$RUNNER_TEMP/bun" "$PKG@1.4.4" --no-audit --no-fund --ignore-scripts >/dev/null
          BUN="$RUNNER_TEMP/bun/node_modules/$PKG/bin/bun"
          chmod +x "$BUN" && "$BUN" --version && echo "path=$BUN" >> "$GITHUB_OUTPUT"

      - name: Recenzent
        id: claude
        if: steps.visual.outputs.skip != 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions[bot]   # kolejne etapy uruchamia workflow_dispatch od github-actions
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: ${{ steps.data.outputs.prompt }}
          claude_args: >-
            --model ${{ matrix.member.model }}
            --allowedTools ${{ steps.data.outputs.tools }}
            --disallowedTools ${{ steps.data.outputs.denied }}
            --json-schema '${{ steps.data.outputs.schema }}'

      - name: Czy Claude wystartował
        id: started
        if: steps.claude.outcome == 'failure'
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          # Limit subskrypcji: ponowna próba nic nie da, etap poczeka na reset (krok „Limit subskrypcji”).
          if [ "$(node "$F/scripts/workflow/limit-cli.ts" limit --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" | sed -n 's/^limited=//p')" = true ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Awaria infrastruktury (np. pobieranie narzędzi akcji) albo błąd bez żadnej pracy: jedna ponowna próba.
          if node "$F/scripts/workflow/cli.ts" started --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}"; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Claude nie wystartował; ponowna próba za minutę."
            sleep 60
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Recenzent (ponowna próba)
        id: claude_retry
        if: steps.started.outputs.retry == 'true'
        continue-on-error: true   # limit po ponownej próbie rozpoznaje krok „Limit subskrypcji”
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions[bot]   # kolejne etapy uruchamia workflow_dispatch od github-actions
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: ${{ steps.data.outputs.prompt }}
          claude_args: >-
            --model ${{ matrix.member.model }}
            --allowedTools ${{ steps.data.outputs.tools }}
            --disallowedTools ${{ steps.data.outputs.denied }}
            --json-schema '${{ steps.data.outputs.schema }}'

      - name: Limit subskrypcji
        id: limit
        if: steps.claude.outcome == 'failure'
        env:
          EXEC: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: node "$F/scripts/workflow/limit-cli.ts" limit --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" >> "$GITHUB_OUTPUT"

      - name: Błąd sesji Claude
        if: >-
          steps.limit.outputs.limited != 'true' && (
            (steps.claude.outcome == 'failure' && steps.started.outputs.retry != 'true') || steps.claude_retry.outcome == 'failure')
        run: |
          echo "::error::Sesja Claude zakończyła się błędem po rozpoczęciu pracy; szczegóły w kroku zużycia."
          exit 1

      - name: Zużycie recenzenta
        id: usage
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXEC: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
          NAME: ${{ matrix.member.name }}
        run: |
          mkdir -p "$(dirname "usage/review-$NAME.json")"
          node "$F/scripts/workflow/cli.ts" usage --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" --stage review --name "$NAME" --out "usage/review-$NAME.json"

      - name: Sprawdzenie werdyktu
        if: steps.limit.outputs.limited != 'true'
        env:
          OUTPUT: ${{ steps.claude_retry.outputs.structured_output || steps.claude.outputs.structured_output || steps.visual.outputs.verdict }}
          NAME: ${{ matrix.member.name }}
        run: |
          mkdir -p verdict
          printf '%s' "$OUTPUT" > "$W/verdict.raw.json"
          node "$F/scripts/workflow/cli.ts" extract verdict "$W/verdict.raw.json" > "verdict/$NAME.json"
          if [ "$(jq -r .perspective "verdict/$NAME.json")" != "$NAME" ]; then
            echo "::error::Werdykt dotyczy innej perspektywy niż $NAME."
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.limit.outputs.limited != 'true'
        with:
          name: factory-verdict-${{ matrix.member.name }}
          path: verdict/

      # Limit subskrypcji: czas resetu dla joba limit (matryca nie ma pewnych wyjść, więc idzie przez artefakt).
      - name: Czas resetu limitu
        if: steps.limit.outputs.limited == 'true'
        env:
          UNTIL: ${{ steps.limit.outputs.until }}
          NAME: ${{ matrix.member.name }}
        run: mkdir -p limit && printf '%s\n' "$UNTIL" > "limit/$NAME.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.limit.outputs.limited == 'true'
        with:
          name: factory-limit-${{ matrix.member.name }}
          path: limit/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: factory-usage-review-${{ matrix.member.name }}
          path: usage/
          if-no-files-found: ignore

  gallery:
    # Linki do par wzorzec–wykonanie w komentarzu PR, żeby właściciel porównał je sam, także z telefonu.
    # Obrazy trafiają na gałąź factory-screenshots: jeden commit bez historii, tylko zrzuty otwartych PR.
    # Job nie pobiera kodu PR i nie uruchamia Claude; pliki z artefaktu skrypt sprawdza od nowa.
    needs: [guard, ci]
    if: always() && needs.guard.outputs.ok == 'true' && needs.ci.outputs.screenshots == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # tylko gałąź factory-screenshots
      pull-requests: write   # komentarz ze zrzutami
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-screenshots
          merge-multiple: true
          path: ${{ runner.temp }}/shots
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-screenshots-base
          merge-multiple: true
          path: ${{ runner.temp }}/shots-base

      - name: Zrzuty w PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          SHA: ${{ needs.ci.outputs.sha }}
          ROUND: ${{ needs.ci.outputs.round }}
        run: |
          SHOTS="$RUNNER_TEMP/shots" PUBLISH="$RUNNER_TEMP/publish"
          mkdir -p "$SHOTS"
          # Skrypt sprawdza pliki od nowa (nazwy, nagłówek PNG, limity) i do $PUBLISH zapisuje tylko obrazy galerii:
          # wzorzec obok wykonania w jednym pliku. Zmienione sekcje wskazuje porównanie z zrzutami gałęzi bazowej.
          node "$F/scripts/workflow/cli.ts" gallery --dir "$SHOTS" --before "$RUNNER_TEMP/shots-base" --publish "$PUBLISH" \
            --sha "$SHA" --round "${ROUND:-0}" --out "$RUNNER_TEMP/gallery.md" \
            --url "$GITHUB_SERVER_URL/$GH_REPO/raw/factory-screenshots/pr-$PR/$SHA" \
            --run-url "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          OPEN=$(gh pr list --state open --limit 500 --json number --jq '[.[].number] | map(tostring) | join(" ")')
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $AUTH" \
            bash "$F/scripts/workflow/gallery-push.sh" "$GITHUB_SERVER_URL/$GH_REPO.git" "$PUBLISH" "$PR" "$SHA" "$OPEN"
          # W każdej rundzie nowy komentarz pod najnowszymi zdarzeniami PR (np. po /change), a poprzedni znika:
          # jego linki prowadziłyby do obrazów, których na gałęzi już nie ma.
          OLD=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- factory:screenshots -->"))) | .id')
          gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$RUNNER_TEMP/gallery.md" > /dev/null
          for ID in $OLD; do gh api -X DELETE "repos/$GH_REPO/issues/comments/$ID" > /dev/null || true; done

  # Limit subskrypcji u któregokolwiek recenzenta: recenzja czeka na reset i wznowi się cała; pętla i ocena ryzyka nie ruszają.
  limit:
    needs: [guard, reviewer]
    if: always() && needs.guard.outputs.ok == 'true' && needs.reviewer.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      limited: ${{ steps.until.outputs.limited }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-limit-*
          merge-multiple: true
          path: ${{ runner.temp }}/limit
      - name: Czy recenzent trafił na limit
        id: until
        run: |
          UNTIL=$(cat "$RUNNER_TEMP"/limit/*.txt 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z$' | sort | tail -n 1 || true)
          if [ -n "$UNTIL" ]; then
            { echo "limited=true"; echo "until=$UNTIL"; } >> "$GITHUB_OUTPUT"
          else
            echo "limited=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.until.outputs.limited == 'true'
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.until.outputs.limited == 'true'
        with:
          node-version: ${{ inputs.node_version }}
      - name: Recenzja czeka na limit
        if: steps.until.outputs.limited == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE: review
          PR: ${{ inputs.pr }}
          UNTIL: ${{ steps.until.outputs.until }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .factory-src/scripts/workflow/limit-pause.sh

  loop:
    needs: [guard, ci, panel, reviewer, limit]
    if: >-
      always() && needs.guard.outputs.ok == 'true' && needs.ci.result == 'success' && needs.panel.result == 'success' &&
      needs.limit.outputs.limited != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write
      actions: write
    outputs:
      retry: ${{ steps.decide.outputs.retry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "W=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-review-input
          path: ${{ runner.temp }}/work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-ci
          merge-multiple: true
          path: ${{ runner.temp }}/work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-verdict-*
          merge-multiple: true
          path: ${{ runner.temp }}/work/verdicts
      # Koszt recenzentów tej rundy: przy kolejnej rundzie nie ma werdyktu, więc trafia do komentarza rundy.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-usage-review-*
          merge-multiple: true
          path: ${{ runner.temp }}/work/usage

      - name: Kolejna runda albo ocena ryzyka
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          AUTO: ${{ needs.ci.outputs.auto }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          DECISION=$(node "$F/scripts/workflow/cli.ts" loop --work "$W" --config "$W/config.json" --round "${AUTO:-0}" --usage "$W/usage" --out "$W/round.md")
          echo "Pętla poprawek: $(jq -r .reason <<<"$DECISION")" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq -r .retry <<<"$DECISION")" != true ] || [ "$(gh pr view "$PR" --json state --jq .state)" != OPEN ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ISSUE=$(jq -r .issue "$W/implementation.json")
          ID=$(gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@"$W/round.md" --jq .id)
          DEFAULT=$(gh api "repos/$GH_REPO" --jq .default_branch)
          gh workflow run "$WORKFLOW" --ref "$DEFAULT" -f stage=implement -f issue="$ISSUE" -f pr="$PR" -f note="$ID"
          echo "retry=true" >> "$GITHUB_OUTPUT"
