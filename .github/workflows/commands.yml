# Komendy właściciela w komentarzu: /approve, /reject, /change, /split, /stop, /start. Na dawne /veto taśma
# odpowiada, że okna weta już nie ma (dwa poziomy ryzyka: Low scala fabryka, High czeka na właściciela).
# /approve w issue z etykietą needs-approval to zgoda na nowe zależności z planu.
# /stop <powód> zatrzymuje taśmę (issue „Taśma zatrzymana”), a /start ją wznawia razem z wstrzymanymi etapami.
# Działają tylko od właściciela repo i kont z listy `trusted`; konto workflowów nie wydaje komend.
# Treść komentarza trafia do skryptu wyłącznie przez zmienne środowiskowe.
name: factory-commands

on:
  workflow_call:
    inputs:
      trusted: { type: string, default: '' }
      workflow: { type: string, default: factory.yml }
      factory_ref: { type: string, default: main, description: 'Wersja skryptów fabryki (wznowienie taśmy)' }

permissions: {}

jobs:
  command:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    steps:
      - name: Komenda
        id: parse
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA: ${{ inputs.trusted }}
          BODY: ${{ github.event.comment.body }}
        run: |
          if [[ ",$OWNER,$EXTRA," != *",$ACTOR,"* ]]; then
            echo "::notice::Komendy przyjmuję tylko od właściciela i zaufanych kont; $ACTOR do nich nie należy."
            exit 0
          fi
          # Bez rozróżniania wielkości liter: autokorekta w telefonie zmienia „/change” na „/Change”.
          FIRST=$(printf '%s\n' "$BODY" | head -n 1 | tr -d '\r' | sed -E 's/^[[:space:]]+//')
          COMMAND=$(sed -nE 's#^/(approve|veto|reject|change|split|stop|start)([[:space:]:,.!].*)?$#\1#Ip' <<<"$FIRST" | tr '[:upper:]' '[:lower:]')
          # Komentarz zaczyna się od „/”, ale komendy nie ma: taśma odpowiada, zamiast milczeć.
          UNKNOWN=""
          if [ -z "$COMMAND" ] && [[ "$FIRST" =~ ^/([A-Za-z]{1,20})([[:space:]:,.!]|$) ]]; then UNKNOWN="${BASH_REMATCH[1]}"; fi
          { echo "command=$COMMAND"; echo "unknown=$UNKNOWN"; } >> "$GITHUB_OUTPUT"

      - name: Nieznana komenda
        if: steps.parse.outputs.unknown != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          UNKNOWN: ${{ steps.parse.outputs.unknown }}
        run: |
          gh issue comment "$NUMBER" --body "Nie znam komendy \`/$UNKNOWN\`, więc nic nie zrobiłem. Komendy taśmy: \`/approve\`, \`/reject\`, \`/change <uwagi>\`, \`/split\`, \`/stop <powód>\`, \`/start\`."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.parse.outputs.command == 'start'
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false

      - name: Wykonanie
        if: steps.parse.outputs.command != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMAND: ${{ steps.parse.outputs.command }}
          NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          COMMENT: ${{ github.event.comment.id }}
          BODY: ${{ github.event.comment.body }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          DEFAULT=$(gh api "repos/$GH_REPO" --jq .default_branch)
          label() { gh label create "$1" --force >/dev/null; gh issue edit "$NUMBER" --add-label "$1"; }
          unlabel() { gh issue edit "$NUMBER" --remove-label "$1" >/dev/null 2>&1 || true; }
          # Kolejka: zamknięcie PR albo zmiana etykiet przez bota nie uruchamia workflowów, więc komenda woła ją sama.
          queue() { gh workflow run "$WORKFLOW" --ref "$DEFAULT" -f stage=queue || echo "::warning::Nie udało się uruchomić kolejki; ruszy przy dziennym przeglądzie."; }
          case "$COMMAND" in
            approve)
              label factory:approved
              # Zgoda na nowe zależności z planu: zadanie trafia do kolejki, a ta uruchamia implementera.
              if [ "$IS_PR" != true ] && gh issue view "$NUMBER" --json labels --jq '.labels[].name' | grep -qx needs-approval; then
                unlabel needs-approval
                label queued
                queue
              fi
              ;;
            veto)
              gh issue comment "$NUMBER" --body "Okna weta już nie ma: Low fabryka scala sama, a High czeka na Twoją decyzję. Żeby zatrzymać PR, napisz \`/reject\` albo \`/change <uwagi>\`."
              ;;
            reject)
              label rejected
              if [ "$IS_PR" = true ]; then gh pr close "$NUMBER" --comment "Odrzucone komendą /reject."; fi
              queue
              ;;
            change)
              if [ "$IS_PR" != true ]; then gh issue comment "$NUMBER" --body "/change działa tylko w PR."; exit 0; fi
              # Numer issue z gałęzi factory/<numer>-…, którą nadaje fabryka. GitHub nie zawsze łączy PR z issue
              # przez „Closes #N”, więc powiązanie to tylko zapas.
              BRANCH=$(gh pr view "$NUMBER" --json headRefName --jq .headRefName)
              ISSUE=$(sed -nE 's#^factory/([0-9]+)-.*#\1#p' <<<"$BRANCH")
              if [ -z "$ISSUE" ]; then
                ISSUE=$(gh pr view "$NUMBER" --json closingIssuesReferences --jq '.closingIssuesReferences[0].number // empty')
              fi
              if [ -z "$ISSUE" ]; then gh pr comment "$NUMBER" --body "Nie znalazłem issue tego PR: gałąź nie jest factory/<numer>-… i PR nie zamyka żadnego issue."; exit 0; fi
              gh workflow run "$WORKFLOW" --ref "$DEFAULT" -f stage=implement -f issue="$ISSUE" -f pr="$NUMBER" -f note="$COMMENT"
              ;;
            split)
              if [ "$IS_PR" = true ]; then gh pr comment "$NUMBER" --body "/split działa w issue, nie w PR."; exit 0; fi
              # Za późno, gdy taśma już pracuje nad zadaniem: plan trwa (etykieta ready), otwarty PR fabryki albo plan,
              # który nie czeka (kolejka, zgoda, blokada). Podział w tej chwili zdublowałby pracę planera i implementera.
              LABELS=$(gh issue view "$NUMBER" --json labels --jq '[.labels[].name]')
              OPEN=$(gh pr list --state open --limit 100 --json headRefName --jq "[.[] | select(.headRefName | startswith(\"factory/$NUMBER-\"))] | length")
              if [ "$OPEN" -gt 0 ] || jq -e 'any(.[]; . == "ready") or (any(.[]; . == "planned") and (any(.[]; . == "queued" or . == "needs-approval" or . == "blocked") | not))' <<<"$LABELS" >/dev/null; then
                gh issue comment "$NUMBER" --body "Za późno na \`/split\`: taśma już planuje albo realizuje #$NUMBER, a podział zdublowałby pracę. Odrzuć zadanie przez \`/reject\` i załóż nowe issue bez \`ready\`, a potem napisz w nim \`/split\`."
                exit 0
              fi
              label split
              gh workflow run "$WORKFLOW" --ref "$DEFAULT" -f stage=plan -f issue="$NUMBER" -f note=split
              ;;
            stop)
              # Powód: reszta komentarza po /stop. Taśma stoi, dopóki issue z etykietą factory:stopped jest otwarte.
              REASON=$(printf '%s' "$BODY" | sed -E '1s#^[[:space:]]*/stop[[:space:]:,.!]*##I' | tr -s '[:space:]' ' ' | sed -E 's/^ +| +$//g')
              REASON=${REASON:-bez podanego powodu}
              STOP=$(gh issue list --label factory:stopped --state open --limit 1 --json number --jq '.[0].number // empty')
              if [ -n "$STOP" ]; then
                gh issue comment "$STOP" --body "Kolejne \`/stop\` w #$NUMBER: $REASON"
              else
                DATA=$(jq -nc --arg reason "$REASON" --arg from "$NUMBER" '{reason: $reason, from: $from}' | sed 's/</\\u003c/g; s/>/\\u003e/g')
                printf 'Taśmę zatrzymała komenda `/stop` w #%s.\n\n**Powód:** %s\n\nPlan, implementacja, recenzja i kolejka czekają; dziennik i komendy działają. Etapy, które miały ruszyć, dostają etykietę `factory:paused`. Wznowienie: `/start` w dowolnym issue albo PR.\n\n<!-- factory:stop %s -->\n' \
                  "$NUMBER" "$REASON" "$DATA" > stop.md
                gh label create factory:stopped --force --description 'Taśma fabryki zatrzymana' >/dev/null
                URL=$(gh issue create --title 'Taśma zatrzymana' --label factory:stopped --body-file stop.md)
                STOP=${URL##*/}
              fi
              gh issue comment "$NUMBER" --body "⏸️ Taśma zatrzymana (#$STOP). Wznowienie: \`/start\`."
              ;;
            start)
              STOPS=$(gh issue list --label factory:stopped --state open --json number --jq '.[].number')
              if [ -z "$STOPS" ]; then
                # Taśma działa: /start tylko sprawdza kolejkę, np. gdy zadanie czeka na nowy dzień limitu.
                queue
                gh issue comment "$NUMBER" --body "Taśma działa; kolejka sprawdza czekające zadania."
                exit 0
              fi
              # Zamyka issue zatrzymania (/stop i limit subskrypcji), wznawia wstrzymane etapy i uruchamia kolejkę.
              # shellcheck disable=SC2086
              RESUMED=$(MESSAGE="Taśma wznowiona komendą \`/start\` w #$NUMBER." WORKFLOW="$WORKFLOW" \
                bash .factory-src/scripts/workflow/resume.sh $STOPS)
              gh issue comment "$NUMBER" --body "▶️ Taśma wznowiona. Wstrzymane etapy, które ruszyły ponownie: $RESUMED; kolejka sprawdza czekające zadania."
              ;;
          esac
          gh api "repos/$GH_REPO/issues/comments/$COMMENT/reactions" -f content=eyes >/dev/null
