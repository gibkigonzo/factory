# Kolejka zadań: zamawia plan dla issue z etykietą `queued`, które mieszczą się w limicie WIP, mają scalone zadania
# z sekcji „Zależy od” i nie dzielą plików z zadaniami w toku (implementera od razu tylko dla planu, na którego
# zależności właściciel dał zgodę), a dla otwartych PR fabryki z konfliktem uruchamia rundę jego rozwiązania.
# Projekt wywołuje ją po zamknięciu PR fabryki i raz dziennie.
# Kodu z PR nie pobiera: czyta factory.yml z gałęzi głównej i dane z API.
name: factory-queue

on:
  workflow_call:
    inputs:
      factory_ref: { type: string, default: main }
      node_version: { type: string, default: '22' }
      workflow: { type: string, default: factory.yml, description: 'Plik workflowu projektu, który wywołuje fabrykę' }

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write   # komentarz o konflikcie w PR uruchamia rundę implementera; bez tego GitHub zwraca 403
      actions: write
    # Jedno uruchomienie naraz, żeby dwa nie wpuściły tego samego issue. Czekające zastępuje nowsze: liczy od nowa.
    concurrency:
      group: factory-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "RAW=$RUNNER_TEMP/queue" >> "$GITHUB_ENV"

      - name: Czekające zadania
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          mkdir -p "$RAW"
          node "$F/scripts/config/cli.ts" factory.yml --json > "$RAW/config.json"
          LIMIT=$(jq .wip_limit "$RAW/config.json")
          bash "$F/scripts/workflow/queue-raw.sh" "$RAW"
          DEFAULT=$(gh api "repos/$GH_REPO" --jq .default_branch)
          STEPS=$(node "$F/scripts/workflow/cli.ts" queue-release --raw "$RAW" --limit "$LIMIT")
          jq -c '.[]' <<<"$STEPS" | while read -r STEP; do
            ISSUE=$(jq -r .issue <<<"$STEP")
            case "$(jq -r .action <<<"$STEP")" in
              plan)
                # Świeży plan na aktualnym kodzie. Etykieta `ready` od bota nie uruchamia workflowu, więc etap woła kolejka.
                gh issue edit "$ISSUE" --remove-label queued --add-label ready >/dev/null
                gh issue comment "$ISSUE" --body "Zadanie się zwolniło: planer pisze plan na aktualnym kodzie, a implementer ruszy po nim." >/dev/null
                gh workflow run "$WORKFLOW" --ref "$DEFAULT" -f stage=plan -f issue="$ISSUE"
                ;;
              implement)
                gh issue edit "$ISSUE" --remove-label queued >/dev/null
                gh issue comment "$ISSUE" --body "Zadanie się zwolniło: implementer rusza." >/dev/null
                gh workflow run "$WORKFLOW" --ref "$DEFAULT" -f stage=implement -f issue="$ISSUE"
                ;;
              blocked)
                gh label create blocked --force >/dev/null
                gh issue edit "$ISSUE" --remove-label queued --add-label blocked >/dev/null
                gh issue comment "$ISSUE" --body "$(jq -r .reason <<<"$STEP")" >/dev/null
                ;;
            esac
          done
          WAITING=$(jq '[.[] | select(any(.labels[]; .name == "queued"))] | length' "$RAW/issues.json")
          echo "Czekało zadań: $WAITING. Ruszają: $(jq -r '[.[] | "#\(.issue) \(.action)"] | join(", ") | if . == "" then "nic" else . end' <<<"$STEPS")" >> "$GITHUB_STEP_SUMMARY"

      # Scalony PR fabryki mógł wprowadzić konflikt w innych otwartych PR. Taśma rozwiązuje go rundą implementera.
      - name: Konflikty otwartych PR z gałęzią główną
        continue-on-error: true   # błąd tu nie zatrzymuje kolejki; sprawdzi to dzienny przegląd
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          N=$(bash "$F/scripts/workflow/conflicts.sh")
          echo "Rundy rozwiązania konfliktu: $N" >> "$GITHUB_STEP_SUMMARY"
