# Dziennik trybu cienia: przypięte issue „Tryb cienia” z metrykami i stanem Bramki 1.
# Liczy go skrypt z danych o PR-ach fabryki (gałęzie factory/*): werdykty, reakcje 👍/👎, merge, revert.
# Reakcje nie uruchamiają workflowów, więc projekt odświeża dziennik po każdym werdykcie,
# po zamknięciu PR fabryki i raz dziennie. Kodu z PR nie pobiera: czyta tylko gałąź główną i API.
# Po scaleniu PR fabryki zamyka jego issue: GitHub nie zawsze łączy PR z issue przez „Closes #N”.
name: factory-journal

on:
  workflow_call:
    inputs:
      factory_ref: { type: string, default: main }
      node_version: { type: string, default: '22' }
      trusted: { type: string, default: '', description: 'Konta, których 👍/👎 liczą się obok właściciela' }

permissions: {}

jobs:
  close-issue:
    if: github.event_name == 'pull_request_target' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Zamknięcie issue scalonego PR fabryki
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Numer z gałęzi factory/<numer>-…, którą nadaje fabryka; inne gałęzie pomija.
          ISSUE=$(sed -nE 's#^factory/([0-9]+)-.*#\1#p' <<<"$BRANCH")
          if [ -z "$ISSUE" ]; then echo "Gałąź $BRANCH nie wskazuje issue."; exit 0; fi
          if [ "$(gh issue view "$ISSUE" --json state --jq .state)" = OPEN ]; then
            gh issue close "$ISSUE" --reason completed --comment "Zamknięte po scaleniu PR #$PR."
          fi

  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "RAW=$RUNNER_TEMP/raw" >> "$GITHUB_ENV"

      - name: Dane o PR-ach fabryki
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RAW/comments" "$RAW/reactions" "$RAW/events" "$RAW/issues" "$RAW/plans"
          gh pr list --state all --limit 1000 \
            --json number,title,body,state,createdAt,mergedAt,closedAt,headRefName,isCrossRepository,labels,mergeCommit,closingIssuesReferences \
            > "$RAW/prs.json"
          FACTORY='.[] | select((.headRefName | startswith("factory/")) and (.isCrossRepository | not))'
          for PR in $(jq -r "$FACTORY | .number" "$RAW/prs.json"); do
            gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- factory:shadow -->")))
                    | {id, body, user: {login: .user.login}, created_at}' \
              | jq -s . > "$RAW/comments/$PR.json"
            for ID in $(jq -r '.[].id' "$RAW/comments/$PR.json"); do
              gh api --paginate "repos/$GH_REPO/issues/comments/$ID/reactions" \
                --jq '.[] | {content, user: {login: .user.login}, created_at}' | jq -s . > "$RAW/reactions/$ID.json"
            done
          done
          # Numery issue liczy skrypt: z nazwy gałęzi factory/<numer>-…, a w zapasie z powiązań PR.
          for ISSUE in $(node "$F/scripts/workflow/cli.ts" journal-issues --raw "$RAW"); do
            gh api --paginate "repos/$GH_REPO/issues/$ISSUE/events" \
              --jq '.[] | select(.event == "labeled") | {event, label: {name: .label.name}, created_at}' \
              | jq -s . > "$RAW/events/$ISSUE.json"
            gh api "repos/$GH_REPO/issues/$ISSUE" --jq '{created_at}' > "$RAW/issues/$ISSUE.json"
            gh api --paginate "repos/$GH_REPO/issues/$ISSUE/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- factory:plan -->"))) | {body}' \
              | jq -s . > "$RAW/plans/$ISSUE.json"
          done
          {
            echo "Dane dziennika: PR-y fabryki $(jq "[$FACTORY] | length" "$RAW/prs.json"), issue $(ls "$RAW/issues" | wc -l),"
            echo "zdarzenia ready $(cat "$RAW"/events/*.json 2>/dev/null | jq -s '[.[][] | select(.label.name == "ready")] | length')."
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          git log --grep='This reverts commit' --format='%x1e%cI%x09%B' HEAD > "$RAW/reverts.txt"

      - name: Dziennik
        env:
          OWNER: ${{ github.repository_owner }}
          EXTRA: ${{ inputs.trusted }}
        run: |
          node "$F/scripts/config/cli.ts" factory.yml --json > "$RAW/config.json"
          mkdir -p journal
          node "$F/scripts/workflow/cli.ts" journal --raw "$RAW" --config "$RAW/config.json" --owners "$OWNER,$EXTRA" \
            > journal/journal.md
          cat journal/journal.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-journal
          path: journal/

  publish:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    # Jeden zapis naraz, żeby dwa uruchomienia nie założyły dwóch dzienników.
    concurrency:
      group: factory-journal
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-journal
          path: journal

      - name: Issue „Tryb cienia”
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NUMBER=$(gh issue list --label factory:journal --state all --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue edit "$NUMBER" --body-file journal/journal.md >/dev/null
          else
            gh label create factory:journal --force --description 'Dziennik trybu cienia' >/dev/null
            URL=$(gh issue create --title 'Tryb cienia' --label factory:journal --body-file journal/journal.md)
            NUMBER=${URL##*/}
            ID=$(gh issue view "$NUMBER" --json id --jq .id)
            gh api graphql -f query='mutation($id: ID!) { pinIssue(input: {issueId: $id}) { issue { number } } }' \
              -f id="$ID" >/dev/null || echo "::notice::Nie udało się przypiąć #$NUMBER. Przypnij je ręcznie."
          fi
          echo "Dziennik trybu cienia: #$NUMBER"
