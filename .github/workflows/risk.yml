# Etap oceny ryzyka po recenzji: oceniacz (reguła 2), reguły ryzyka, check factory/risk, etykieta risk:* i raport w PR.
# W Etapie 0 check jest tylko informacyjny (neutral): fabryka niczego nie scala.
# Wywołuj w tym samym uruchomieniu co review.yml (needs), bo korzysta z jego artefaktów.
# Artefakt factory-risk (ocena, dowody, raport, werdykt trybu cienia) czyta potem merge.yml.
name: factory-risk

on:
  workflow_call:
    inputs:
      pr: { type: string, required: true }
      factory_ref: { type: string, default: main }
      runs_on: { type: string, default: ubuntu-latest }
      node_version: { type: string, default: '22' }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }

    outputs:
      limited:
        description: 'true, gdy oceniacz trafił na limit subskrypcji; recenzja czeka wtedy na reset, a werdyktu nie ma'
        value: ${{ jobs.assess.outputs.limited }}

permissions: {}

jobs:
  assess:
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on, '[') && inputs.runs_on || format('"{0}"', inputs.runs_on)) }}
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      limited: ${{ steps.limit.outputs.limited }}
      until: ${{ steps.limit.outputs.until }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          printf '.factory/work/\n' >> .git/info/exclude
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "W=.factory/work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-review-input
          path: .factory/work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-verdict-*
          merge-multiple: true
          path: .factory/work/verdicts

      - name: Prompt oceniacza
        id: data
        run: |
          node "$F/scripts/workflow/cli.ts" prompt assess --work "$W" > "$W/prompt.md"
          {
            echo "model=$(node "$F/scripts/workflow/cli.ts" model risk_assessor --config "$W/config.json")"
            echo "schema=$(node "$F/scripts/workflow/cli.ts" schema behavior)"
            echo "tools=$(node "$F/scripts/workflow/cli.ts" tools read)"
            echo "denied=$(node "$F/scripts/workflow/cli.ts" denied-tools)"
            echo "prompt<<FACTORY_EOF"; cat "$W/prompt.md"; echo "FACTORY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Bun dla akcji Claude
        id: bun
        continue-on-error: true
        run: |
          # Bun z rejestru npm zamiast z GitHub Releases, które bywają niedostępne (HTTP 504).
          # Wersja jak w przypiętym claude-code-action. Gdy się nie uda, akcja pobierze Buna sama.
          [ "$(uname -s)" = Linux ] || exit 0
          case "$(uname -m)" in x86_64) PKG=@oven/bun-linux-x64 ;; aarch64|arm64) PKG=@oven/bun-linux-aarch64 ;; *) exit 0 ;; esac
          npm install --prefix "$RUNNER_TEMP/bun" "$PKG@1.4.4" --no-audit --no-fund --ignore-scripts >/dev/null
          BUN="$RUNNER_TEMP/bun/node_modules/$PKG/bin/bun"
          chmod +x "$BUN" && "$BUN" --version && echo "path=$BUN" >> "$GITHUB_OUTPUT"

      - name: Oceniacz ryzyka
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions[bot]   # kolejne etapy uruchamia workflow_dispatch od github-actions
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: ${{ steps.data.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.data.outputs.model }}
            --allowedTools ${{ steps.data.outputs.tools }}
            --disallowedTools ${{ steps.data.outputs.denied }}
            --json-schema '${{ steps.data.outputs.schema }}'

      - name: Czy Claude wystartował
        id: started
        if: steps.claude.outcome == 'failure'
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          # Limit subskrypcji: ponowna próba nic nie da, etap poczeka na reset (krok „Limit subskrypcji”).
          if [ "$(node "$F/scripts/workflow/limit-cli.ts" limit --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" | sed -n 's/^limited=//p')" = true ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Awaria infrastruktury (np. pobieranie narzędzi akcji) albo błąd bez żadnej pracy: jedna ponowna próba.
          if node "$F/scripts/workflow/cli.ts" started --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}"; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Claude nie wystartował; ponowna próba za minutę."
            sleep 60
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Oceniacz ryzyka (ponowna próba)
        id: claude_retry
        if: steps.started.outputs.retry == 'true'
        continue-on-error: true   # limit po ponownej próbie rozpoznaje krok „Limit subskrypcji”
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions[bot]   # kolejne etapy uruchamia workflow_dispatch od github-actions
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: ${{ steps.data.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.data.outputs.model }}
            --allowedTools ${{ steps.data.outputs.tools }}
            --disallowedTools ${{ steps.data.outputs.denied }}
            --json-schema '${{ steps.data.outputs.schema }}'

      - name: Limit subskrypcji
        id: limit
        if: steps.claude.outcome == 'failure'
        env:
          EXEC: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: node "$F/scripts/workflow/limit-cli.ts" limit --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" >> "$GITHUB_OUTPUT"

      - name: Błąd sesji Claude
        if: >-
          steps.limit.outputs.limited != 'true' && (
            (steps.claude.outcome == 'failure' && steps.started.outputs.retry != 'true') || steps.claude_retry.outcome == 'failure')
        run: |
          echo "::error::Sesja Claude zakończyła się błędem po rozpoczęciu pracy; szczegóły w kroku zużycia."
          exit 1

      - name: Zużycie oceniacza
        id: usage
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXEC: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$(dirname "usage/assess.json")"
          node "$F/scripts/workflow/cli.ts" usage --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" --stage assess --out "usage/assess.json"

      - name: Sprawdzenie oceny
        if: steps.limit.outputs.limited != 'true'
        env:
          OUTPUT: ${{ steps.claude_retry.outputs.structured_output || steps.claude.outputs.structured_output }}
        run: |
          mkdir -p behavior
          printf '%s' "$OUTPUT" > "$W/behavior.raw.json"
          node "$F/scripts/workflow/cli.ts" extract behavior "$W/behavior.raw.json" > behavior/behavior.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-behavior
          path: behavior/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: factory-usage-assess
          path: usage/
          if-no-files-found: ignore

  # Limit subskrypcji Claude: etap czeka na reset zamiast blokady. Zapis jak przy /stop (factory:paused) i issue
  # „Taśma czeka na limit subskrypcji”; pierwsze zdarzenie taśmy po resecie wznowi etap.
  # Ocena ryzyka korzysta z artefaktów recenzji z tego samego przebiegu, więc wznawia się całą recenzję.
  limit:
    needs: assess
    if: always() && needs.assess.outputs.limited == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Etap czeka na limit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE: review
          ISSUE: ''
          PR: ${{ inputs.pr }}
          NOTE: ''
          UNTIL: ${{ needs.assess.outputs.until }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .factory-src/scripts/workflow/limit-pause.sh

  rules:
    needs: assess
    if: always() && needs.assess.outputs.limited != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ inputs.pr }}/head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          printf '.factory/work/\n' >> .git/info/exclude
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "W=.factory/work" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-review-input
          path: .factory/work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-verdict-*
          merge-multiple: true
          path: .factory/work/verdicts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-ci
          merge-multiple: true
          path: .factory/work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-behavior
          merge-multiple: true
          path: .factory/work
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: factory-usage-*
          merge-multiple: true
          path: .factory/work/usage

      - name: Dowody i reguły ryzyka
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
        run: |
          BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          # Automatyczne rundy poprawek: wszystkie rundy minus rundy po /change właściciela (factory:change-N)
          # i rundy konfliktu z gałęzią główną (factory:conflict-N).
          ROUNDS=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '
            ([.labels[].name | select(startswith("factory:round-")) | ltrimstr("factory:round-") | tonumber] | max // 0)
            - ([.labels[].name | select(startswith("factory:change-") or startswith("factory:conflict-"))] | length) | if . < 0 then 0 else . end')
          node "$F/scripts/workflow/cli.ts" evidence --work "$W" --rounds "$ROUNDS" > "$W/evidence.json"
          # Ten sam punkt rozgałęzienia co w recenzji (base.sha z panelu), bo PR mógł zostać scalony w trakcie.
          FORK=$(cat "$W/base.sha" 2>/dev/null || echo "origin/$BASE")
          node "$F/scripts/risk-rules.ts" --base "$FORK" --head HEAD --evidence "$W/evidence.json" --json > "$W/assessment.json"
          node "$F/scripts/workflow/cli.ts" report --assessment "$W/assessment.json" --panel "$W/panel.json" > "$W/report.md"
          node "$F/scripts/workflow/cli.ts" usage-sum --dir "$W/usage" > "$W/usage.json"
          node "$F/scripts/workflow/cli.ts" shadow-comment --pr "$PR" --assessment "$W/assessment.json" \
            --evidence "$W/evidence.json" --config "$W/config.json" --usage "$W/usage.json" > "$W/shadow.md"
          mkdir -p risk && cp "$W/evidence.json" "$W/assessment.json" "$W/report.md" "$W/shadow.md" "$W/config.json" "$W/usage.json" risk/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-risk
          path: risk/

  report:
    needs: rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-risk
          path: risk

      - name: Check factory/risk, etykieta i raport
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          LEVEL=$(jq -r .level risk/assessment.json)
          LOWER=$(printf '%s' "$LEVEL" | tr '[:upper:]' '[:lower:]')
          jq -n --arg sha "$SHA" --arg title "Poziom ryzyka: $LEVEL" --rawfile summary risk/report.md \
            '{name: "factory/risk", head_sha: $sha, status: "completed", conclusion: "neutral", output: {title: $title, summary: $summary}}' \
            | gh api "repos/$GH_REPO/check-runs" --input - >/dev/null
          for label in risk:low risk:medium risk:high; do
            gh label create "$label" --force >/dev/null
            if [ "$label" != "risk:$LOWER" ]; then gh pr edit "$PR" --remove-label "$label" >/dev/null 2>&1 || true; fi
          done
          gh pr edit "$PR" --add-label "risk:$LOWER"
          ID=$(gh api --paginate "repos/$GH_REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- factory:report -->"))) | .id' | tail -n 1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$ID" -F body=@risk/report.md >/dev/null
          else
            gh pr comment "$PR" --body-file risk/report.md
          fi
