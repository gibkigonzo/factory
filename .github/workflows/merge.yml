# Merger: co fabryka robi z PR po ocenie ryzyka. Decyduje skrypt (scripts/shadow/decision.ts), nie model.
# Etap 0, tryb cienia: nigdy nie scala. Dodaje w PR nowy komentarz z werdyktem: Low scaliłaby od razu,
# High przekazałaby Tobie. Oceniasz go reakcją 👍 albo 👎, a oceny zbiera journal.yml.
# Wywołuj w tym samym uruchomieniu co risk.yml (needs), bo czyta jego artefakt factory-risk.
name: factory-merge

on:
  workflow_call:
    inputs:
      pr: { type: string, required: true }

permissions: {}

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-risk
          path: risk

      - name: Werdykt trybu cienia
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          # Zawsze nowy komentarz: reakcja dotyczy konkretnego werdyktu, także po kolejnej rundzie poprawek.
          gh api "repos/$GH_REPO/issues/$PR/comments" -F body=@risk/shadow.md --jq .html_url
