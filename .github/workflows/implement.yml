# Etap implementacji: zaplanowane issue → patch od implementera → PR z gałęzi factory/*.
# Claude zmienia pliki z prawem odczytu repo i bez poświadczeń git. Patch sprawdza skrypt
# (pliki chronione, .github/), a gałąź, commit, push i PR robi osobny job bez Claude.
name: factory-implement

on:
  workflow_call:
    inputs:
      issue: { type: string, required: true }
      pr: { type: string, default: '', description: 'Numer PR przy poprawce (/change)' }
      note: { type: string, default: '', description: 'Id komentarza z opisem poprawki' }
      factory_ref: { type: string, default: main }
      runs_on: { type: string, default: ubuntu-latest }
      node_version: { type: string, default: '22' }
      trusted: { type: string, default: '' }
      workflow: { type: string, default: factory.yml }
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: { required: true }

permissions: {}

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ok: ${{ steps.trust.outputs.ok }}
    steps:
      - id: trust
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA: ${{ inputs.trusted }}
        run: |
          if [[ ",$OWNER,github-actions[bot],$EXTRA," == *",$ACTOR,"* ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Konto $ACTOR nie jest na liście zaufanych; taśma pomija to zdarzenie."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

  implement:
    needs: guard
    if: needs.guard.outputs.ok == 'true'
    runs-on: ${{ fromJSON(startsWith(inputs.runs_on, '[') && inputs.runs_on || format('"{0}"', inputs.runs_on)) }}
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    outputs:
      implementation: ${{ steps.collect.outputs.implementation }}
      branch: ${{ steps.collect.outputs.branch }}
      title: ${{ steps.data.outputs.title }}
      empty: ${{ steps.collect.outputs.empty }}
      status: ${{ steps.collect.outputs.status }}
      blocker: ${{ steps.deps.outputs.blocker || steps.collect.outputs.blocker }}
      usage: ${{ steps.usage.outputs.usage }}
      over_budget: ${{ steps.budget.outputs.skip }}
      line: ${{ steps.collect.outputs.line }}
      kind: ${{ steps.data.outputs.kind }}
      limited: ${{ steps.limit.outputs.limited }}
      until: ${{ steps.limit.outputs.until }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr != '' && format('refs/pull/{0}/head', inputs.pr) || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Narzędzia fabryki
        run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
          mkdir -p .factory/work/screenshots && printf '.factory/work/\nnode_modules/\n' >> .git/info/exclude
          echo "F=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"
          echo "W=.factory/work" >> "$GITHUB_ENV"
          # Katalog dla komendy evidence.screenshots, którą implementer może uruchomić; poza patchem (.git/info/exclude).
          echo "FACTORY_SCREENSHOTS=$GITHUB_WORKSPACE/.factory/work/screenshots" >> "$GITHUB_ENV"
          corepack enable || true

      - name: Dane dla implementera
        id: data
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
          NOTE: ${{ inputs.note }}
          PR: ${{ inputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            # Kontrakt z gałęzi bazowej, nie z PR: narzędzia implementera nie mogą pochodzić z pliku, który sam zmienił.
            BASE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
            mkdir -p "$RUNNER_TEMP/base"
            git archive "origin/$BASE" factory.yml .factory/perspectives 2>/dev/null | tar -x -C "$RUNNER_TEMP/base" \
              || git show "origin/$BASE:factory.yml" > "$RUNNER_TEMP/base/factory.yml"
            node "$F/scripts/config/cli.ts" "$RUNNER_TEMP/base/factory.yml" --json > "$W/config.json"
          else
            node "$F/scripts/config/cli.ts" factory.yml --json > "$W/config.json"
          fi
          gh issue view "$ISSUE" --json title,body --jq '"# " + .title + "\n\n" + .body' > "$W/issue.md"
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE/comments" | jq -s add \
            | node "$F/scripts/workflow/cli.ts" find-plan --issue "$ISSUE" > "$W/plan.json"
          CHANGE=""
          KIND=""
          if [ -n "$NOTE" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$NOTE" --jq .body > "$W/change.md"
            CHANGE="--change"
            # Runda z pętli (komentarz taśmy) albo z /change właściciela; ta druga nie liczy się do limitu rund.
            if head -n 1 "$W/change.md" | grep -qF '<!-- factory:round -->'; then KIND=loop; else KIND=change; fi
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          node "$F/scripts/workflow/cli.ts" prompt implement --work "$W" --issue "$ISSUE" $CHANGE > "$W/prompt.md"
          {
            echo "title=$(gh issue view "$ISSUE" --json title --jq .title)"
            echo "model=$(node "$F/scripts/workflow/cli.ts" model implementer --config "$W/config.json")"
            echo "schema=$(node "$F/scripts/workflow/cli.ts" schema implementation)"
            echo "tools=$(node "$F/scripts/workflow/cli.ts" tools implement --config "$W/config.json")"
            echo "prompt<<FACTORY_EOF"; cat "$W/prompt.md"; echo "FACTORY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Limit dotyczy nowych zadań. Rundy poprawek otwartego PR (pętla, /change) go nie sprawdzają,
      # bo pętla kończy się po risk.max_review_rounds rundach, a PR nie powinien zostać bez werdyktu.
      - name: Budżet dzienny
        id: budget
        if: inputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          LIMIT=$(jq .daily_runs "$W/config.json")
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?created=>=$(date -u +%F)&per_page=100" \
            --jq '[.workflow_runs[] | {display_title, event}]' | jq -s 'add // []' > "$W/runs.json"
          COUNT=$(node "$F/scripts/workflow/cli.ts" budget --runs "$W/runs.json")
          echo "Przebiegi z Claude dzisiaj (UTC): $COUNT z $LIMIT" >> "$GITHUB_STEP_SUMMARY"
          if [ "$COUNT" -gt "$LIMIT" ]; then
            echo "::warning::Dzienny limit uruchomień ($LIMIT) wyczerpany; zadanie czeka w kolejce do jutra."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Komenda setup z factory.yml
        if: steps.budget.outputs.skip != 'true'
        run: |
          SETUP=$(jq -r '.commands.setup // empty' "$W/config.json")
          # Projekt zakładany od zera nie ma jeszcze manifestu (np. package.json). Implementer ma setup
          # w dozwolonych komendach i uruchomi go sam, więc tu nieudany setup tylko ostrzega.
          if [ -n "$SETUP" ] && ! bash -c "$SETUP"; then
            echo "::warning::Komenda setup nie przeszła; implementer rusza bez niej i może uruchomić ją sam."
          fi

      - name: Nowe zależności z planu
        id: deps
        if: steps.budget.outputs.skip != 'true' && inputs.pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: |
          # Instaluje workflow, nie implementer, i tylko po zgodzie właściciela (/approve w issue).
          # Komendy są z factory.yml gałęzi głównej, a nazwy i wersje pakietów sprawdza skrypt.
          if [ "$(jq '.dependencies // [] | length' "$W/plan.json")" -eq 0 ]; then exit 0; fi
          if ! gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qx factory:approved; then
            echo "blocker=plan dodaje nowe zależności, a nie ma Twojej zgody (/approve w issue)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! COMMANDS=$(node "$F/scripts/workflow/cli.ts" install-commands --plan "$W/plan.json" --config "$W/config.json" 2> "$W/install.err"); then
            echo "blocker=$(tr '\n' ' ' < "$W/install.err")" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r CMD; do
            echo "::group::$CMD"
            if ! bash -c "$CMD"; then
              echo "::endgroup::"
              echo "blocker=instalacja nie przeszła: $CMD" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::endgroup::"
          done <<<"$COMMANDS"

      - name: Bun dla akcji Claude
        id: bun
        continue-on-error: true
        run: |
          # Bun z rejestru npm zamiast z GitHub Releases, które bywają niedostępne (HTTP 504).
          # Wersja jak w przypiętym claude-code-action. Gdy się nie uda, akcja pobierze Buna sama.
          [ "$(uname -s)" = Linux ] || exit 0
          case "$(uname -m)" in x86_64) PKG=@oven/bun-linux-x64 ;; aarch64|arm64) PKG=@oven/bun-linux-aarch64 ;; *) exit 0 ;; esac
          npm install --prefix "$RUNNER_TEMP/bun" "$PKG@1.4.4" --no-audit --no-fund --ignore-scripts >/dev/null
          BUN="$RUNNER_TEMP/bun/node_modules/$PKG/bin/bun"
          chmod +x "$BUN" && "$BUN" --version && echo "path=$BUN" >> "$GITHUB_OUTPUT"

      - name: Implementer
        id: claude
        if: steps.budget.outputs.skip != 'true' && steps.deps.outputs.blocker == ''
        continue-on-error: true
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions[bot]   # kolejne etapy uruchamia workflow_dispatch od github-actions
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: ${{ steps.data.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.data.outputs.model }}
            --allowedTools "${{ steps.data.outputs.tools }}"
            --disallowedTools WebFetch,WebSearch
            --json-schema '${{ steps.data.outputs.schema }}'

      - name: Czy Claude wystartował
        id: started
        if: steps.claude.outcome == 'failure'
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          # Limit subskrypcji: ponowna próba nic nie da, etap poczeka na reset (krok „Limit subskrypcji”).
          if [ "$(node "$F/scripts/workflow/limit-cli.ts" limit --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" | sed -n 's/^limited=//p')" = true ]; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Awaria infrastruktury (np. pobieranie narzędzi akcji) albo błąd bez żadnej pracy: jedna ponowna próba.
          if node "$F/scripts/workflow/cli.ts" started --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}"; then
            echo "retry=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Claude nie wystartował; ponowna próba za minutę."
            sleep 60
            echo "retry=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Implementer (ponowna próba)
        id: claude_retry
        if: steps.started.outputs.retry == 'true'
        continue-on-error: true   # limit po ponownej próbie rozpoznaje krok „Limit subskrypcji”
        uses: anthropics/claude-code-action@402b5b79551e3ce6614c179fbccbfdb79291cead # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: github-actions[bot]   # kolejne etapy uruchamia workflow_dispatch od github-actions
          path_to_bun_executable: ${{ steps.bun.outputs.path }}
          prompt: ${{ steps.data.outputs.prompt }}
          claude_args: >-
            --model ${{ steps.data.outputs.model }}
            --allowedTools "${{ steps.data.outputs.tools }}"
            --disallowedTools WebFetch,WebSearch
            --json-schema '${{ steps.data.outputs.schema }}'

      - name: Limit subskrypcji
        id: limit
        if: steps.claude.outcome == 'failure'
        env:
          EXEC: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: node "$F/scripts/workflow/limit-cli.ts" limit --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" >> "$GITHUB_OUTPUT"

      - name: Błąd sesji Claude
        if: >-
          steps.limit.outputs.limited != 'true' && (
            (steps.claude.outcome == 'failure' && steps.started.outputs.retry != 'true') || steps.claude_retry.outcome == 'failure')
        run: |
          echo "::error::Sesja Claude zakończyła się błędem po rozpoczęciu pracy; szczegóły w kroku zużycia."
          exit 1

      - name: Zużycie implementera
        id: usage
        if: always() && steps.claude.outcome != 'skipped'
        continue-on-error: true
        env:
          EXEC: ${{ steps.claude_retry.outputs.execution_file || steps.claude.outputs.execution_file }}
        run: |
          mkdir -p "$(dirname "$W/usage.json")"
          node "$F/scripts/workflow/cli.ts" usage --file "${EXEC:-$RUNNER_TEMP/claude-execution-output.json}" --stage implement --out "$W/usage.json"
          { echo "usage<<FACTORY_EOF"; cat "$W/usage.json" 2>/dev/null || echo '[]'; echo; echo "FACTORY_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Patch i sprawdzenie zmienionych ścieżek
        id: collect
        if: steps.budget.outputs.skip != 'true' && steps.deps.outputs.blocker == '' && steps.limit.outputs.limited != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUT: ${{ steps.claude_retry.outputs.structured_output || steps.claude.outputs.structured_output }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          TITLE: ${{ steps.data.outputs.title }}
        run: |
          git add -A
          # --no-renames: przy zmianie nazwy lista ma starą i nową ścieżkę, więc przeniesienie pliku chronionego też odpada.
          git diff --cached --name-only --no-renames > "$W/paths.txt"
          node "$F/scripts/workflow/cli.ts" check-paths --config "$W/config.json" < "$W/paths.txt"
          git diff --cached --binary > "$W/change.patch"
          printf '%s' "$OUTPUT" > "$W/implementation.raw.json"
          node "$F/scripts/workflow/cli.ts" extract implementation "$W/implementation.raw.json" > "$W/implementation.json"
          if [ -n "$PR" ]; then
            BRANCH=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          else
            BRANCH=$(node "$F/scripts/workflow/cli.ts" branch --issue "$ISSUE" --title "$TITLE")
          fi
          {
            echo "branch=$BRANCH"
            echo "empty=$([ -s "$W/change.patch" ] && echo false || echo true)"
            echo "status=$(jq -r '.status // "done"' "$W/implementation.json")"
            echo "blocker=$(jq -r '.blocker // "" | gsub("\\s+"; " ")' "$W/implementation.json")"
            echo "implementation<<FACTORY_EOF"; cat "$W/implementation.json"; echo "FACTORY_EOF"
            # Problem taśmy (narzędzia, komendy projektu) do komentarza z blokadą; przy PR trafia do opisu PR.
            echo "line<<FACTORY_EOF"; node "$F/scripts/workflow/cli.ts" line-problem --stage implement --implementation "$W/implementation.json"; echo; echo "FACTORY_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-change
          path: .factory/work/change.patch
          if-no-files-found: ignore

  # Runda poprawek bez zmian w plikach (implementer wyjaśnił uwagi w założeniach) też tu trafia:
  # bez commita aktualizuje opis PR, dodaje etykietę rundy i uruchamia recenzję. Limit rund dalej działa.
  publish:
    needs: implement
    if: >-
      needs.implement.outputs.status == 'done' && (needs.implement.outputs.empty == 'false' ||
        (inputs.pr != '' && needs.implement.outputs.blocker == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.pr != '' && needs.implement.outputs.branch || '' }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - run: |
          mv .factory-src "$RUNNER_TEMP/factory"
          npm ci --prefix "$RUNNER_TEMP/factory" --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.implement.outputs.empty == 'false'
        with:
          name: factory-change
          path: ${{ runner.temp }}/change

      - name: Gałąź, commit, push i PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          BRANCH: ${{ needs.implement.outputs.branch }}
          TITLE: ${{ needs.implement.outputs.title }}
          IMPLEMENTATION: ${{ needs.implement.outputs.implementation }}
          USAGE: ${{ needs.implement.outputs.usage }}
          EMPTY: ${{ needs.implement.outputs.empty }}
          KIND: ${{ needs.implement.outputs.kind }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          F="$RUNNER_TEMP/factory"
          DEFAULT=$(gh api "repos/$GH_REPO" --jq .default_branch)
          if [ "$EMPTY" != true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git apply --index "$RUNNER_TEMP/change/change.patch"
            git commit -m "factory: $TITLE (#$ISSUE)"
            if [ -z "$PR" ]; then
              # Nowa gałąź factory/* należy do taśmy; po nieudanej próbie nadpisujemy ją bez otwartego PR.
              git push --force origin "HEAD:refs/heads/$BRANCH"
            else
              git push origin "HEAD:$BRANCH"
            fi
          fi

          printf '%s' "$IMPLEMENTATION" > "$RUNNER_TEMP/implementation.json"
          printf '%s' "$USAGE" > "$RUNNER_TEMP/usage.json"
          # Opis PR niesie zużycie wszystkich rund implementacji, więc poprzednie bierzemy z dotychczasowego opisu.
          if [ -n "$PR" ]; then gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/previous.md"; fi
          node "$F/scripts/workflow/cli.ts" pr-body --implementation "$RUNNER_TEMP/implementation.json" \
            --usage "$RUNNER_TEMP/usage.json" --previous "$RUNNER_TEMP/previous.md" > "$RUNNER_TEMP/body.md"
          if [ -z "$PR" ]; then
            URL=$(gh pr create --base "$DEFAULT" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md")
            PR=${URL##*/}
            gh issue comment "$ISSUE" --body "Implementer przygotował PR #$PR. Teraz recenzja i ocena ryzyka."
          else
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
            ROUND=$(gh pr view "$PR" --json labels --jq '[.labels[].name | select(startswith("factory:round-")) | ltrimstr("factory:round-") | tonumber] | max // 0')
            NEXT=$((ROUND + 1))
            gh label create "factory:round-$NEXT" --force >/dev/null
            gh pr edit "$PR" --add-label "factory:round-$NEXT"
            if [ "$KIND" = change ]; then
              # Runda na polecenie właściciela: numeruje się jak inne, ale nie zmniejsza limitu automatycznych rund.
              gh label create "factory:change-$NEXT" --force --description 'Runda poprawek po /change właściciela' >/dev/null
              gh pr edit "$PR" --add-label "factory:change-$NEXT"
            fi
            if [ "$EMPTY" = true ]; then
              node "$F/scripts/workflow/cli.ts" no-change-comment --implementation "$RUNNER_TEMP/implementation.json" --round "$NEXT" > "$RUNNER_TEMP/no-change.md"
              gh pr comment "$PR" --body-file "$RUNNER_TEMP/no-change.md"
            fi
          fi
          # Poprawka po wcześniejszej blokadzie (np. /change) trafiła do PR, więc zadanie nie jest już zablokowane.
          gh issue edit "$ISSUE" --remove-label blocked >/dev/null 2>&1 || true
          gh workflow run "$WORKFLOW" --ref "$DEFAULT" -f stage=review -f pr="$PR"

  # Limit subskrypcji Claude: etap czeka na reset zamiast blokady. Zapis jak przy /stop (factory:paused) i issue
  # „Taśma czeka na limit subskrypcji”; pierwsze zdarzenie taśmy po resecie wznowi etap.
  limit:
    needs: implement
    if: needs.implement.result == 'success' && needs.implement.outputs.limited == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gibkigonzo/factory
          ref: ${{ inputs.factory_ref }}
          path: .factory-src
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node_version }}
      - name: Etap czeka na limit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE: implement
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          NOTE: ${{ inputs.note }}
          UNTIL: ${{ needs.implement.outputs.until }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .factory-src/scripts/workflow/limit-pause.sh

  # Implementer zgłosił blokadę, zależności się nie zainstalowały albo pierwsza implementacja nie ma żadnej zmiany:
  # bez PR i bez recenzji. Runda poprawek bez zmian ze statusem done idzie do publish.
  blocked:
    needs: implement
    if: >-
      needs.implement.result == 'success' && needs.implement.outputs.over_budget != 'true' &&
      needs.implement.outputs.limited != 'true' && (
        needs.implement.outputs.blocker != '' || needs.implement.outputs.status == 'blocked' ||
        (needs.implement.outputs.empty == 'true' && inputs.pr == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          PR: ${{ inputs.pr }}
          BLOCKER: ${{ needs.implement.outputs.blocker }}
          USAGE: ${{ needs.implement.outputs.usage }}
          LINE: ${{ needs.implement.outputs.line }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          REASON=${BLOCKER:-implementer nie wprowadził żadnej zmiany.}
          if [ -n "$PR" ]; then
            NEXT="Poprawka nie trafiła do PR #$PR, a recenzja nie ruszyła. Po usunięciu przeszkody napisz /change w PR."
          else
            NEXT="PR nie powstał, a recenzja nie ruszyła. Po usunięciu przeszkody nadaj issue etykietę \`ready\` jeszcze raz."
          fi
          printf '<!-- factory:blocked -->\n**Implementer nie dokończył zadania:** %s\n\n%s\n\nLog: %s\n' "$REASON" "$NEXT" "$RUN" > body.md
          if [ -n "${LINE//[[:space:]]/}" ]; then printf '\n%s\n' "$LINE" >> body.md; fi
          # Koszt sesji, która skończyła się blokadą: bez PR nie trafiłby do dziennika.
          if [ "$(jq 'if type == "array" then length else 0 end' <<<"${USAGE:-[]}" 2>/dev/null)" -gt 0 ] 2>/dev/null; then
            printf '\n<!-- factory:usage %s -->\n' "$(jq -c . <<<"$USAGE")" >> body.md
          fi
          gh label create blocked --force >/dev/null
          gh issue edit "$ISSUE" --add-label blocked
          gh issue comment "$ISSUE" --body-file body.md
          if [ -n "$PR" ]; then gh pr comment "$PR" --body-file body.md; fi
          # Zablokowane zadanie zwalnia miejsce w kolejce.
          gh workflow run "$WORKFLOW" --ref "$(gh api "repos/$GH_REPO" --jq .default_branch)" -f stage=queue \
            || echo "::warning::Nie udało się uruchomić kolejki; ruszy przy dziennym przeglądzie."

  failed:
    needs: [implement, publish]
    if: failure() || needs.implement.outputs.over_budget == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ inputs.issue }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OVER: ${{ needs.implement.outputs.over_budget }}
          WORKFLOW: ${{ inputs.workflow }}
        run: |
          if [ "$OVER" = true ]; then
            # Kolejka uruchomi zadanie przy dziennym przeglądzie (schedule), gdy limit się odnowi. GitHub uruchamia
            # przebiegi z harmonogramu z kilkugodzinnym opóźnieniem, więc komunikat nie obiecuje pory.
            # Limit liczy przebiegi od północy UTC.
            gh label create queued --force >/dev/null
            gh issue edit "$ISSUE" --add-label queued
            gh issue comment "$ISSUE" --body "Dzienny limit uruchomień taśmy jest wyczerpany. Zadanie czeka w kolejce i ruszy samo przy dziennym przeglądzie kolejki; GitHub uruchamia go z kilkugodzinnym opóźnieniem. Wcześniej: po północy UTC (1:00 lub 2:00 czasu polskiego) napisz \`/start\` w dowolnym issue. Log: $RUN"
            exit 0
          fi
          gh label create blocked --force >/dev/null
          gh issue edit "$ISSUE" --add-label blocked
          gh issue comment "$ISSUE" --body "Etap implementacji się nie udał (implementer albo publikacja PR). Szczegóły w logu: $RUN"
          gh workflow run "$WORKFLOW" --ref "$(gh api "repos/$GH_REPO" --jq .default_branch)" -f stage=queue \
            || echo "::warning::Nie udało się uruchomić kolejki; ruszy przy dziennym przeglądzie."
